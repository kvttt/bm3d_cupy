[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bm3d-cupy"
version = "0.1.3"
description = "GPU-accelerated BM3D denoising with CuPy"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaibo Tang" }]
keywords = ["BM3D", "CuPy", "denoising", "image-processing", "GPU"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["PyWavelets>=1.5"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x[ctk]>=13.0"]
cuda13 = ["cupy-cuda13x[ctk]>=13.0"]
benchmark = ["bm3d>=4.0.0", "matplotlib>=3.7", "scikit-image>=0.22"]
dev = ["build>=1.2", "twine>=5.0"]

[tool.setuptools]
py-modules = ["bm3d_cupy"]